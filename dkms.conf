# i915 with brightness control for legacy OLED panels (ThinkPad X1 Yoga
# 1st/2nd gen), rebuilt from Debian's linux-source for the kernel at hand.
PACKAGE_NAME="i915-legacy-oled"
PACKAGE_VERSION="0.4"

# i915 only from the Debian linux-source of the kernel's own version, or the
# copy of its i915 that an earlier build kept (prepare-source.sh). Without
# either the kernel is not applicable (exit 77, no error): a failed build
# would fail the kernel's or this package's installation instead. The
# package's trigger on /usr/src builds the module once that linux-source
# arrives.
if [ -n "${kernelver:-}" ]; then
	_series=$(echo "$kernelver" | cut -d. -f1,2)
	_src=$(dpkg-query -W -f='${Version}' "linux-source-$_series" 2>/dev/null || true)
	_hdr=$(dpkg-query -W -f='${Version}' "linux-headers-$kernelver" 2>/dev/null || true)
	if [ -z "$_hdr" ] || {
		{ [ ! -f "/usr/src/linux-source-$_series.tar.xz" ] || [ "$_src" != "$_hdr" ]; } &&
		[ ! -f "/var/cache/i915-legacy-oled/src/linux-source-${_series}_$_hdr.tar.xz" ]
	}; then
		BUILD_EXCLUSIVE_KERNEL="^$"
	fi
	unset _series _src _hdr
fi

# Unpacks i915 from /usr/src/linux-source-<major.minor>.tar.xz (or the kept
# copy) into src/ and patches it; refuses when that source is not the
# kernel's own version.
PRE_BUILD="prepare-source.sh $kernelver"

# The tracepoint headers name their i915 files ../../drivers/gpu/drm/i915/...,
# relative to the kernel's include/trace: src/include/trace makes that path
# land in src.
MAKE[0]="make -j$parallel_jobs -C $kernel_source_dir M=$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build/src/drivers/gpu/drm/i915 KCFLAGS=-I$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build/src/include/trace modules"
CLEAN="rm -rf src"

# kvmgt is built from the same tree and uses i915's structures, so it is
# replaced together with it.
BUILT_MODULE_NAME[0]="i915"
BUILT_MODULE_LOCATION[0]="src/drivers/gpu/drm/i915/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="kvmgt"
BUILT_MODULE_LOCATION[1]="src/drivers/gpu/drm/i915/"
DEST_MODULE_LOCATION[1]="/updates/dkms"

AUTOINSTALL="yes"
